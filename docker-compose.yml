services:

  smartlocker-whatsapp-service:

    build:
      context: .
      dockerfile: Dockerfile

    image: smartlocker-whatsapp-service:1.0.0

    container_name: smartlocker-whatsapp-service

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    volumes:
      - ./storage:/app/storage

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - smartlocker-network

networks:
  smartlocker-network:
    external: true